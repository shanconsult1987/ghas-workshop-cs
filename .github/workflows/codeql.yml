name: CodeQL

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main
      - feature

  schedule:
    - cron: "0 2 * * 1"

jobs:
  analyze:

    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v3
